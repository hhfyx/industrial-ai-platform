# Alembic config for the contract-approval module (docs/module-contract-approval.md).
# Keep this file ASCII: configparser decodes it with the locale codec (GBK on
# zh-CN Windows) and alembic 1.13+ passes encoding="locale" explicitly.
# The DB URL is read from env var BIZ_DB_URL in migrations/env.py, not here.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
