name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for tests
        # **为什么 CI 需要造一个 .env**
        #
        # `app/main.py` 在**模块级**调用 `setup_from_settings()` → `get_settings()`
        # → `Settings()`，而 `LLMSettings.api_key` 是必填字段。
        # `.env` 被 .gitignore + .dockerignore 双重排除，CI 里没有它，
        # 于是 `from app.main import app`（tests/conftest.py 第 38 行）
        # 直接抛 ValidationError：
        #
        #   pydantic_core.ValidationError: 1 validation error for LLMSettings
        #   api_key  Field required [type=missing, input_value={}, ...]
        #
        # 这是**架构的刻意选择**：配置早炸好过半夜点（见 config.py 的 docstring）。
        # 所以修法不是把 main.py 改成懒加载，而是让 CI 提供一份合法的占位配置。
        #
        # 注意：这里只造**测试用**的占位值，不是真凭据。
        # 真正的 LLM 调用在测试里从不发生（autouse fixture 注入规则版）。
        run: |
          cat > .env <<'EOF'
          PORT=8000
          APP_ENV=ci
          LLM_API_KEY=sk-ci-placeholder-not-real
          LLM_BASE_URL=http://127.0.0.1:1/v1
          LLM_MODEL=ci-placeholder-model
          LLM_TIMEOUT=30
          LLM_MAX_RETRIES=2
          EOF
          echo "created .env for CI:"
          grep -c . .env

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # **让 setup-uv 自己准备 Python，而不是后面再跑 uv python install。**
          #
          # 原写法是单独一步：
          #     - name: Set up Python
          #       run: uv python install ${{ matrix.python-version }}
          # 它在 Actions runner 上不稳定（exit code 4 是 pytest 的 ImportError
          # 退出码，不是这一步 —— 之前误判过），而 ubuntu-latest 自带 3.11。
          #
          # setup-uv 的 python-version 会先复用已安装的同版本，
          # 找不到才下载。
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 失败时用 ::error:: 把真实错误写进 annotation。
        # 为什么加这个：GitHub 的 check-run annotation 只告诉我们
        # "Process completed with exit code 4"，行号还不可靠（指向注释），
        # 看不到 uv 到底报了什么。这一步让它自己说出来。
        run: |
          if ! uv sync --frozen; then
            echo "::error::uv sync --frozen 失败（exit $?）"
            echo "--- uv version ---"
            uv --version || true
            echo "--- python ---"
            python3 --version || true
            echo "--- retry with verbose to surface cause ---"
            uv sync --frozen -v 2>&1 | tail -60 || true
            exit 1
          fi

      - name: Lint
        run: |
          if ! uv run ruff check .; then
            echo "::error::Lint 步骤失败"
            exit 1
          fi

      - name: Format check
        run: |
          if ! uv run ruff format --check .; then
            echo "::error::Format check 步骤失败"
            exit 1
          fi

      - name: Tests
        # 不需要真实 LLM_API_KEY：所有测试都用假 client 离线跑。
        # 这正是"服务层不 import fastapi、抽取器接受注入 client"的收益。
        #
        # 失败时把 pytest 输出写进 annotation —— 因为拿不到 job 日志
        # （匿名 API 403，没有 gh CLI），而 annotation 是唯一能读到的通道。
        #
        # 2026-10-30 二次修：上一版只 grep '^(FAILED|ERROR)'，
        # 结果一条都没匹配到 —— 说明失败信息不是以 FAILED 开头
        # （典型情况：pytest 在**收集阶段**就崩了，或 --cov 插件报错）。
        # 现在改成不猜格式，直接把整段输出的尾部打成多条 annotation。
        env:
          EXTRACTOR_IMPL: rule
        run: |
          set -o pipefail
          set +e
          uv run pytest --cov=app --cov-report=term-missing -q 2>&1 | tee /tmp/pytest.log
          rc=$?
          set -e
          echo "pytest exit code = $rc"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo "::error::Tests 失败（exit $rc），输出分条贴在下面"
          # 每 40 行打一条 annotation，避开单条长度限制
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            # 跳过空行，避免刷屏
            if [ -n "$line" ]; then
              echo "::error::[${n}] ${line}"
            fi
          done < /tmp/pytest.log
          exit "$rc"

      - name: Wiring smoke (llm path)
        # **这一条补的是 CI 唯一的盲区。**
        #
        # 上面的测试全部通过 `dependency_overrides` / autouse fixture 注入了
        # 离线规则版 —— 也就是说 `_build_llm_extractor()`
        # （读 env → 校验 key → 造 client）在 CI 里**一次都没被执行过**。
        # 而默认实现是 `llm`：如果它装配有错（缺 key 启动就炸、
        # client 构造参数不对、base_url 格式不认），CI 全绿而线上直接挂。
        #
        # 这不是假设，10/27 出过真事故：网关凭据过期 → 降级 → 响应体多
        # `degraded` → 契约测试挂（而那个测试一行没改）。
        # 装配层的错就是这样才暴露的。
        #
        # `LLM_BASE_URL` 故意指向不可达地址：**只验证装配，不验证调用**。
        # 几秒内跑完，不联网、不花钱、不需要真 key。
        #
        # ⚠️ 2026-10-30 修：这一步原来是 `uv run python -c "..."`，
        # **一直是红的**（`import app` 会 ModuleNotFoundError ——
        # `python -c` 不把当前目录放进 sys.path，而 pytest 会）。
        # 现在改成独立脚本 scripts/ci_wiring_check.py，并在脚本里显式加
        # sys.path。本地和 CI 跑同一份代码，也能单独复现。
        env:
          EXTRACTOR_IMPL: llm
          LLM_API_KEY: sk-ci-placeholder-not-real
          LLM_BASE_URL: http://127.0.0.1:1/v1
          LLM_MODEL: ci-placeholder-model
        run: |
          if ! uv run python scripts/ci_wiring_check.py; then
            echo "::error::Wiring smoke 步骤失败"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t industrial-ai:ci .

      - name: Image size (recorded, not asserted)
        # 数字必须可核对 —— README 里写的大小就是这里打出来的。
        # 只记录不设阈值：镜像大小受基础镜像更新影响，硬设阈值会变成
        # "定期假失败"，那比没有更糟。
        run: docker image ls industrial-ai:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e LLM_API_KEY=sk-ci-placeholder \
            -e EXTRACTOR_IMPL=rule \
            industrial-ai:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs api; exit 1
