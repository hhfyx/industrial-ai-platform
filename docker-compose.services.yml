# W12 周三：双服务编排（api-rag + api-gen + nginx + 可选 redis）
#
# 与 docker-compose.yml（单服务演示版）的关系：
#   单服务版保留 —— 本地开发与 CI 的最小可运行单位（chroma 内嵌，见那边
#   的说明）。本文件是"服务化"形态：两个 uvicorn 进程各跑一个职责面，
#   nginx 统一入口。
#
# 拆分依据（不是"一个进程一个容器"的形式主义）：
#   - api-rag：文档智能面（extract/chat/summarize/rag/agent-tasks）
#     —— CPU 为主、内存大（模型与索引）、延迟敏感（SSE 流式）；
#   - api-gen：图像生成面（generate 同步/异步/任务管理）
#     —— GPU 独占、单 worker 串行（见 generation_queue.py 的说明）；
#   - 两者的故障域隔离：生成面 OOM 不拖垮问答面（周三故障演练①）；
#   - 伸缩维度不同：问答面可横向扩（内存允许时），生成面只有一个 GPU。
#
# healthcheck 用 /api/v2/ready（readiness）而不是 /health（liveness）：
#   depends_on: service_healthy 要的是"能接流量"（模型已加载），
#   不是"进程活着"（模型加载 30s 期间 liveness 也是 200）——
#   用 liveness 做 readiness 的活 = 编排器在加载窗口把流量切进一个
#   还没准备好的服务（liveness/readiness 分离的编排层应用）。
#
# redis 是**可选**服务（profile: redis）：限流的内存桶单实例够用，
# 真正需要 Redis 的是多实例限流（docs/api-spec.md v2.0 写明的边界）。
# 不需要时不启动：`docker compose -f docker-compose.services.yml up`。

services:
  # ------------------------------------------------ 文档智能服务
  api-rag:
    build: .
    image: industrial-ai:v1.3
    container_name: w12-api-rag
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LLM_BASE_URL: http://host.docker.internal:8326/v1
      PORT: "8000"
      # v2 鉴权：三个服务共享同一组 key（nginx 不做鉴权，鉴权在应用层）
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-demo-key-12345678,demo-key-87654321}
      PLATFORM_GLOBAL_QPS: "10"
      PLATFORM_KEY_QPS: "3"
    volumes:
      - chroma-data:/app/data/chroma
      - sessions-data:/app/data/sessions
      - uploads-data:/app/data/uploads
    restart: unless-stopped
    healthcheck:
      # readiness：模型已加载才 200。start_period 覆盖模型加载窗口（30s+）
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 5
    # 资源限制：问答面是内存大户（bge + chroma + 会话库）
    mem_limit: 4g
    # 无 GPU（rag 面不碰 CUDA）

  # ------------------------------------------------ 图像生成服务
  api-gen:
    build: .
    image: industrial-ai:v1.3
    container_name: w12-api-gen
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      LLM_BASE_URL: http://host.docker.internal:8326/v1
      PORT: "8001"
      GENERATOR_IMPL: fake # 真机部署改 sd（weights 卷见下）
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-demo-key-12345678,demo-key-87654321}
      PLATFORM_GLOBAL_QPS: "10"
      PLATFORM_KEY_QPS: "3"
    volumes:
      - gen-output:/app/data/generated
      # GENERATOR_IMPL=sd 时挂权重（大卷，fake 模式不需要）：
      # - sd-weights:/app/models/sd15-lora
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 5
    mem_limit: 8g
    # 真机（GENERATOR_IMPL=sd）时启用 GPU：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ------------------------------------------------ 反向代理
  nginx:
    image: nginx:1.27-alpine
    container_name: w12-nginx
    ports:
      - "8080:80" # 统一入口（宿主机 8080）
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-rag:
        condition: service_healthy # readiness 而非 liveness（文件头说明）
      api-gen:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  # ------------------------------------------------ 可选：Redis（多实例限流）
  redis:
    image: redis:7-alpine
    container_name: w12-redis
    profiles: ["redis"] # 默认不启动：docker compose --profile redis up
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  chroma-data:
  sessions-data:
  uploads-data:
  gen-output:
  # sd-weights:
