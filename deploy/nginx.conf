# W12 周三 · 统一入口反代配置
#
# 设计原则（每条对应一个"为什么"）：
#
# 1. SSE 不缓冲四件套（10:00 路由表 + 13:30 验收）：
#    proxy_buffering off / proxy_cache off / proxy_read_timeout 调大 /
#    proxy_http_version 1.1 —— 应用侧已带 X-Accel-Buffering: no
#    （W2 的 E1、W8 的 F3 落地），但**响应头只是声明**，
#    nginx 配置才是执行：X-Accel-Buffering 会被 nginx 尊重，
#    但依赖声明不如显式配置 —— 两边都写，谁生效都一样。
#
# 2. 超时与业务层预算对齐（14:40 验收）：
#    Agent 任务预算 max_wall_time=120s（budget.py，冻结值）——
#    proxy_read_timeout 必须 > 120s，否则反代在 60s 默认值处掐断
#    一个还有 60s 预算的任务。生成单任务 180s 上限
#    （GENERATION_TIMEOUT_S），同理。
#
# 3. 不重试非幂等请求（必答问题）：
#    nginx 的 proxy_next_upstream 默认含 error/timeout，会对 POST 重试 ——
#    生成两次 = 双倍 GPU 时间，客户端只看到一次请求。
#    显式 `proxy_next_upstream off`（POST 路由）；
#    GET/DELETE 的任务查询与取消（幂等）允许 error 重试。
#    与 W8 的 D4（生成接口的 GPU 独占重试代价）、
#    W11 的重试矩阵（retryable 由代码判定）同一原则在不同层。
#
# 4. 路由表：/api/v1/generate → api-gen，其余 → api-rag。
#    v2 的 /agent-tasks 属于问答面（LLM 调用，无 GPU）。

# ------------------------------------------------ SSE 与长任务的上游组
upstream rag_backend {
    server api-rag:8000;
}

upstream gen_backend {
    server api-gen:8001;
}

server {
    listen 80;
    server_name _;

    # 上传大文件（summarize 的 PDF）：默认 1M 会 413
    client_max_body_size 50m;

    # ==================================================
    # SSE 流式路由（extract/stream、chat/stream、summarize）
    # —— 不缓冲四件套 + 长读超时
    # ==================================================
    location ~ ^/api/v1/(extract/stream|chat/stream|summarize) {        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        # Connection 头交给 keepalive 语义（默认 close 会破坏 SSE 长连接）
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id; # 透传链路 id

        # —— 不缓冲四件套 ——
        proxy_buffering off; # 核心：攒满 buffer 再发 = SSE 失效
        proxy_cache off;
        proxy_read_timeout 300s; # 长摘要 3 分钟+（与 summarize 的 map-reduce 时长对齐）
        proxy_send_timeout 300s;

        # 应用侧 X-Accel-Buffering: no 已声明；这里 off 是执行层兜底
        add_header X-Accel-Buffering no always;
    }

    # ==================================================
    # Agent 任务（v2）：提交/查询/取消
    # 预算 max_wall_time=120s —— read_timeout 必须 > 120s
    # ==================================================
    location /api/v2/agent-tasks {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_read_timeout 180s; # > 预算 120s（反代不能掐断预算内的任务）
        proxy_send_timeout 60s;

        # POST（提交）非幂等：不重试。GET（查询）幂等：允许 error 时换重试。
        # nginx 在 location 级只能给一个值 —— 取最保守的 off，
        # 查询的重试由客户端做（客户端知道哪些请求幂等）。
        proxy_next_upstream off;
    }

    # ==================================================
    # 生成面（项目一）：同步/异步/任务管理
    # 同步生成上限 180s（GENERATION_TIMEOUT_S）—— read_timeout 240s
    # ==================================================
    location /api/v1/generate {
        proxy_pass http://gen_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_read_timeout 240s; # > GENERATION_TIMEOUT_S 180s
        proxy_send_timeout 60s;

        # **必答问题的落地**：POST /generate 非幂等（无幂等键之前），重试
        # = 双倍 GPU。off 掉 —— 客户端超时重发是它的决定（带 seed 时有幂等键，
        # 那时重试是安全的，但 nginx 分不清，统一不重试）。
        proxy_next_upstream off;
    }

    # ==================================================
    # 其余问答面路由（extract / chat / rag / search / ready / health / metrics）
    # GET 为主，天然幂等，允许 error 重试（默认值显式写出）
    # ==================================================
    location / {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_read_timeout 65s; # 普通 JSON 请求的合理上限
        proxy_send_timeout 60s;

        # GET 幂等，error 时重试安全；POST 不在这个 location 里重试
        # （extract/chat 的 POST 都是非幂等 LLM 调用）
        proxy_next_upstream error;
        proxy_next_upstream_tries 2;
    }
}
